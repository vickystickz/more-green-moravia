# =============================================================
# Deploy to GitHub Pages
# Runs on every push to main. It creates frontend/js/env.js from the
# repository secret MAPY_API_KEY (env.js is not in git), makes
# the /en/ and /cz/ language pages, then publishes the frontend/
# folder (frontend/index.html is the site's home page).
#
# One-time setup on GitHub:
#   1. Settings → Secrets and variables → Actions → New repository
#      secret: name MAPY_API_KEY, value = your Mapy.com key
#   2. Settings → Pages → Source: "GitHub Actions"
# =============================================================

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # allows a manual run from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; a newer push cancels an older one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Create frontend/js/env.js from the secret
        env:
          MAPY_API_KEY: ${{ secrets.MAPY_API_KEY }}
          # Repository variable (not a secret): public URL of the backend
          AGENT_API_URL: ${{ vars.AGENT_API_URL }}
        run: |
          if [ -z "$MAPY_API_KEY" ]; then
            echo "::warning::Secret MAPY_API_KEY is not set: search will be disabled on the site."
          fi
          if [ -z "$AGENT_API_URL" ]; then
            echo "::warning::Variable AGENT_API_URL is not set: Ask AI will be off on the site."
          fi
          {
            printf "export const MAPY_API_KEY = '%s';\n" "$MAPY_API_KEY"
            printf "export const AGENT_API_URL = '%s';\n" "$AGENT_API_URL"
          } > frontend/js/env.js

      # /en/ and /cz/ are copies of index.html. <base href="../">
      # makes their css/, js/, data/ and assets/ links point to the
      # main folder, so nothing is duplicated. The page reads its
      # language from the folder name (js/ui/i18n.js).
      - name: Make the /en/ and /cz/ language pages
        working-directory: frontend
        run: |
          for code in en cz; do
            html_lang=$([ "$code" = cz ] && echo cs || echo en)
            mkdir -p "$code"
            sed -e 's|<head>|<head><base href="../">|' \
                -e "s|<html lang=\"en\">|<html lang=\"$html_lang\">|" \
                index.html > "$code/index.html"
          done
          grep -q '<base href="../">' cz/index.html
          grep -q '<html lang="cs">' cz/index.html

      - name: Set up Pages
        uses: actions/configure-pages@v5

      - name: Upload the site
        uses: actions/upload-pages-artifact@v4
        with:
          path: frontend

  # Deploy runs as its own job (GitHub's recommended layout) so the
  # artifact is fully registered before deploy-pages looks it up.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
